<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>РІЛС, ЩО ПРОДАЮТЬ — презентація курсу</title>
<!-- Презентація 16:9 (1280×720). Заглушки позначено «ЗАМІНИ». PDF генерується скриптом export-pdf. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --ink:#0d0b09; --paper:#f4efe6; --paper-dim:#e9e1d2;
  --rec:#ff3b30; --rec-deep:#d92c22; --lime:#d8f34f;
  --display:'Unbounded',sans-serif; --body:'Golos Text',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
@page{size:1280px 720px;margin:0}
body{font-family:var(--body);color:var(--ink);background:#555}
.slide{
  width:1280px;height:720px;position:relative;overflow:hidden;
  background:var(--paper);page-break-after:always;
  padding:64px 72px;display:flex;flex-direction:column;
}
.slide--dark{background:var(--ink);color:var(--paper)}
.slide--dark .kicker{color:var(--lime)}
.grain::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--rec-deep);display:flex;align-items:center;gap:10px;margin-bottom:24px}
.kicker::before{content:'';width:34px;height:2px;background:currentColor}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:44px;line-height:1.04;margin-bottom:34px}
h2 em,h1 em{font-style:normal;color:var(--rec)}
.pagenum{position:absolute;bottom:26px;right:34px;font-family:var(--mono);font-size:12px;opacity:.5}
.footer-tag{position:absolute;bottom:26px;left:72px;font-family:var(--mono);font-size:12px;opacity:.5;letter-spacing:.08em}
.mono{font-family:var(--mono)}
.mark{background:var(--lime);padding:1px 8px}
.slide--dark .mark{color:var(--ink)}
</style>
</head>
<body>
<!-- SLIDES -->
</body>
</html>
